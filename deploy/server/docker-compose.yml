# CodeMentor — college-server stack (16 cores / 32 GB).
#
#   internet/LAN -> nginx :80 -> /api  -> backend  x4  (least_conn)
#                             -> else  -> frontend x2
#   backend -> srh -> redis        (local cache + shared rate limits)
#   backend -> judge0_server       (code execution, internal network only)
#
# Run from the repo root:
#   cp backend/.env.example .env     # fill in; see deploy/server/README.md
#   docker compose -f deploy/server/docker-compose.yml up -d --build
# Scale the API later:  docker compose -f deploy/server/docker-compose.yml up -d --scale backend=6
#   then:               docker compose -f deploy/server/docker-compose.yml restart nginx
#
# NOTE: no container_name on backend/frontend, so they can be scaled.

name: codementor

x-backend-env: &backend-env
  JUDGE0_URL: http://judge0_server:2358
  # Local Redis behind an Upstash-compatible REST gateway: no code change, no cloud round trip.
  UPSTASH_REDIS_REST_URL: http://srh:80
  UPSTASH_REDIS_REST_TOKEN: ${SRH_TOKEN:?set SRH_TOKEN in .env}
  TRUST_PROXY: "1"          # exactly one proxy (nginx) in front
  NODE_ENV: production

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks: [app_net]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3

  frontend:
    build:
      context: ../../frontend-next
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://backend:3001
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
    restart: unless-stopped
    deploy:
      replicas: 2
    expose: ["3000"]
    networks: [app_net]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../../.env
    environment:
      <<: *backend-env
    deploy:
      replicas: 4
    expose: ["3001"]
    depends_on:
      redis:
        condition: service_healthy
      srh:
        condition: service_started
      judge0_server:
        condition: service_started
    networks: [app_net, judge0_net]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app_net]

  # Upstash-compatible REST gateway over the local Redis (third-party image; pin a version after the first test).
  srh:
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN:?set SRH_TOKEN in .env}
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks: [app_net]

  # ── Judge0 (same as the root compose; worker counts come from judge0/judge0.conf) ──
  judge0_server:
    image: judge0/judge0:1.13.1
    volumes:
      - ../../judge0/judge0.conf:/judge0.conf:ro
    privileged: true
    restart: unless-stopped
    depends_on:
      judge0_db: {condition: service_healthy}
      judge0_redis: {condition: service_healthy}
    environment: &judge0-env
      REDIS_HOST: judge0_redis
      REDIS_PORT: 6379
      POSTGRES_HOST: judge0_db
      POSTGRES_PORT: 5432
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:?set JUDGE0_DB_PASSWORD in .env}
    networks: [judge0_net]

  judge0_worker:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ../../judge0/judge0.conf:/judge0.conf:ro
    privileged: true
    restart: unless-stopped
    depends_on:
      judge0_db: {condition: service_healthy}
      judge0_redis: {condition: service_healthy}
    environment: *judge0-env
    networks: [judge0_net]

  judge0_db:
    image: postgres:13-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD:?set JUDGE0_DB_PASSWORD in .env}
    volumes:
      - judge0_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [judge0_net]

  judge0_redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [judge0_net]

volumes:
  judge0_postgres_data:

networks:
  app_net: {driver: bridge}
  judge0_net: {driver: bridge}
