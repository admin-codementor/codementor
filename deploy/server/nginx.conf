# nginx for the college server. /api goes straight to the API replicas (not through Next.js).
# "backend" and "frontend" resolve to every replica; nginx reads them when it starts,
# so after scaling run:  docker compose -f deploy/server/docker-compose.yml restart nginx
worker_processes auto;
events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

  upstream api { least_conn; server backend:3001;  keepalive 64; }
  upstream web { least_conn; server frontend:3000; keepalive 32; }

  server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # Overwrite, never append: a client must not be able to spoof its own IP.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    location /api/ { proxy_pass http://api; }
    location = /health { proxy_pass http://api; access_log off; }

    # Built, hashed files: browsers may keep them for a year.
    location /_next/static/ {
      proxy_pass http://web;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / { proxy_pass http://web; }
  }
}
