# Dependency updates, kept small on purpose.
#   - Security updates still arrive on their own (the "security" group).
#   - Ordinary minor and patch updates are grouped into ONE pull request per app per week, instead of one each.
#   - Major versions are NOT opened automatically for the packages below, each for a reason. A major upgrade is a deliberate task: it
#     needs a branch, the checks, and a real look in a browser. Remove an entry here when you are ready to do that upgrade.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ['*']
    ignore:
      # uuid 12 and later are ESM-only. The backend loads it with require(), which then depends on a Node feature that only exists from
      # 22.12. We only use v4(), so there is nothing to gain; crypto.randomUUID() is the way out when this is worth doing.
      - dependency-name: uuid
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /frontend-next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ['*']
    ignore:
      # @types/node must describe the Node we run (22, see "engines"). Version 26 describes Node 26 and lets code use APIs that do not exist.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint does not support TypeScript 7 yet ("typescript-eslint does not support TS 7.0"), so the build fails.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # @mui/system must be the same major as @mui/material (6). Moving to 9 is a whole MUI migration, not one package.
      - dependency-name: '@mui/*'
        update-types: ['version-update:semver-major']
      # Sign-in depends on it and a real sign-in test is needed before a major change.
      - dependency-name: firebase
        update-types: ['version-update:semver-major']
      # Page animations; a major change needs a visual check of every animated screen.
      - dependency-name: framer-motion
        update-types: ['version-update:semver-major']
      # react and react-dom are pinned to the same exact version and must be bumped together by hand.
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    ignore:
      # Node 22 is what package.json "engines" and CI use. Changing the runtime is a deliberate task (move all three together).
      - dependency-name: node
        update-types: ['version-update:semver-major']
