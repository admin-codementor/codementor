name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, smoke tests & Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # The Firestore emulator is a Java program.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      # Runs the suite against a throwaway in-memory Firestore, never the real
      # project — no credentials exist in CI, and tests/withEmulator.js refuses to
      # start unless FIRESTORE_EMULATOR_HOST is set. Checks needing Judge0 or the
      # AI provider report SKIPPED here; they are covered by `npm run preflight`
      # before a deploy.
      - name: Smoke tests (Firestore emulator)
        run: >
          npx --yes firebase-tools@15 emulators:exec
          --only firestore
          --project codementor-ci
          "cd backend && npm run test:emulator"

      - name: Build Docker image
        run: docker build -t codementor-backend:ci ./backend

  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install dependencies
        working-directory: frontend-next
        run: npm ci

      - name: Lint
        working-directory: frontend-next
        run: npm run lint

      - name: Build
        working-directory: frontend-next
        # These NEXT_PUBLIC_* values are public, non-secret browser config (see
        # frontend-next/.env.example) — placeholders here just satisfy Firebase's
        # client-side init check during build-time prerendering of /login, /register.
        # Real values are never needed for a "does it build" check.
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCI00000000000000000000000000000
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
        run: npm run build

      - name: Build Docker image
        run: |
          docker build -t codementor-frontend:ci ./frontend-next \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyCI00000000000000000000000000000 \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=ci-placeholder.firebaseapp.com \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=ci-placeholder \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=ci-placeholder.firebasestorage.app \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=000000000000 \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=1:000000000000:web:0000000000000000000000
