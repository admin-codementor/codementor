name: Keep backend awake

# Render's free tier spins the backend down after ~15 minutes with no
# incoming traffic, and the next real request then pays a 30-50s cold-start
# wait. This pings the backend's own health route every 10 minutes (comfortably
# inside that 15-minute window) so it never gets the chance to sleep.
#
# Free on a public repo: GitHub Actions minutes are unlimited here, and each
# run is a single curl taking a few seconds.
#
# Known limits (not fixable, just worth knowing):
#   - GitHub only guarantees a scheduled run will FIRE, not that it fires
#     exactly on time — during platform load it can be a few minutes late.
#     10-minute spacing leaves slack for that inside Render's 15-minute window.
#   - GitHub disables a repo's scheduled workflows automatically after 60 days
#     with no commits at all to the repo. An actively-developed repo like this
#     one won't hit that, but if commits ever stop for 2 months, this job will
#     silently stop running until someone re-enables it in the Actions tab.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -fsS --max-time 60 "${{ vars.BACKEND_URL || 'https://codementor-wzh6.onrender.com' }}/health"
