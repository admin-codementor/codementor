name: Security scans

# Accepted findings live in security/accepted-audit-risks.json (npm), .trivyignore.yaml (image) and .gitleaksignore (secrets), each with a
# reason and, for the first two, a review date. Report-only for now: these scans run on every pull request and every Monday, and show their findings in the Actions tab and the
# Security tab, but they are NOT required checks, so they cannot block a merge yet. Today `npm audit` already reports critical and
# high findings in both apps (see docs/PROJECT_LOG.md), so a blocking gate would stop everything. Once those are fixed, make
# the scans required in branch protection.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: Security — CodeQL (code analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  secrets:
    name: Security — secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The container is run directly: the packaged action needs a paid licence for organisation accounts.
      - name: Scan the whole history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --no-banner --redact --verbose

  dependencies:
    name: Security — dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend-next]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Fails on any high or critical finding that is not listed, with a reason and a review date, in
      # security/accepted-audit-risks.json. (`npm audit` reads the lockfile, so no install is needed.)
      - name: npm audit gate (production dependencies)
        run: node scripts/audit-gate.cjs ${{ matrix.app }}

  image:
    name: Security — container image scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the backend image
        run: docker build -t codementor-backend:scan backend
      # The scanner is run as its own container (pinned version), like the secret scan above.
      - name: Scan the image for known vulnerabilities (critical and high, with a fix available)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work aquasec/trivy:0.69.3
          image --skip-version-check --ignorefile .trivyignore.yaml
          --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 codementor-backend:scan
