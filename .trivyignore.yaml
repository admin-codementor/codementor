# Known findings in the container image that were looked at and accepted for now. Each entry expires, so it cannot be forgotten.
# The only accepted source is JPlag 5.1.0 (the plagiarism checker): its single "jar-with-dependencies" file bundles older Jackson,
# protobuf and JLine libraries, and they cannot be updated without upgrading JPlag itself. JPlag reads students' source files and
# writes a report; it does not deserialize untrusted JSON, which is what the Jackson findings need. Upgrading JPlag changes its
# command line and needs Java to test, so it is a separate task: review by 2026-12-01.
vulnerabilities:
  - id: CVE-2026-68494
    paths: ["app/jplag/jplag.jar"]
    statement: "JPlag 5.1.0 bundled jackson-core; accepted until JPlag is upgraded"
    expired_at: 2026-12-01
